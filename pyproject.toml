[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "homophily-sim"
version = "0.0.1"
description = "Simulación exploratoria de homofilia conductual en una cohorte sintética."
readme = "README.md"
requires-python = ">=3.14"
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-runtime.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
